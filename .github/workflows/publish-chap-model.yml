name: Publish CHAP model image

on:
  push:
    branches: [main]
    paths:
      - "chap_model/**"
      - ".github/workflows/publish-chap-model.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./chap_model
          push: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
          tags: ghcr.io/gichangi/chat-chap-heatwave-model:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
